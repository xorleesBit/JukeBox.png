version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: logerbot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "80013002"
      POSTGRES_DB: logerbot_db
    ports:
      # В формате "ВНЕШНИЙ_ПОРТ:ВНУТРЕННИЙ_ПОРТ"
      # Если порт 5432 занят другим контейнером, используем 5433
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    container_name: logerbot_app
    restart: always
    depends_on:
      - db
    environment:
      # Подключение к базе внутри сети Docker (используем имя сервиса 'db' и порт 5432)
      - DATABASE_URL=postgresql://postgres:80013002@db:5432/logerbot_db
    env_file:
      - .env
    volumes:
      # Пробрасываем папки для сохранения голоса и логов
      - ./voice_logs:/app/voice_logs
      # Общие логи через Volume
      - logs_data:/app/logs
      # Схемы логики (n8n style)
      - flows_data:/app/data/flows
      # ПРОБРОС КОДА (Позволяет обновлять код без пересборки образа)
      - ./bot_app:/app/bot_app
      - ./start.py:/app/start.py
      - ./requirements.txt:/app/requirements.txt
    command: >
      sh -c "pip install -r requirements.txt && python start.py"

  panel:
    build: ./panel_api
    container_name: logerbot_panel_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MASTER_KEY=${PANEL_MASTER_KEY:-secret123}
    volumes:
      # Читаем те же логи
      - logs_data:/app/logs
      # Управление схемами
      - flows_data:/app/data/flows
      # Управление Docker
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  logs_data:
  flows_data: